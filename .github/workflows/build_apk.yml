name: Compilation APK Android

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler le fichier APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installer Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Générer l'arborescence Android officielle
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          flutter create --platforms=android --org com.example .
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Mettre à jour compileSdk et targetSdk à 36 (App + Plugins)
        run: |
          echo "flutter.compileSdkVersion=36" >> android/local.properties
          echo "flutter.targetSdkVersion=36" >> android/local.properties
          echo "flutter.minSdkVersion=21" >> android/local.properties

          python3 -c '
          import os

          # Patch app build files
          for p in ["android/app/build.gradle.kts", "android/app/build.gradle"]:
              if os.path.exists(p):
                  with open(p, "r") as f:
                      c = f.read()
                  c = c.replace("flutter.compileSdkVersion", "36").replace("flutter.targetSdkVersion", "36")
                  with open(p, "w") as f:
                      f.write(c)

          # Override subprojects compileSdk in root build.gradle.kts / build.gradle
          root_kts = "android/build.gradle.kts"
          if os.path.exists(root_kts):
              with open(root_kts, "a") as f:
                  f.write("\nsubprojects { afterEvaluate { val a = extensions.findByName(\"android\"); if (a != null) { try { a.javaClass.getMethod(\"compileSdkVersion\", Int::class.javaPrimitiveType).invoke(a, 36) } catch (e: Exception) {} } } }\n")

          root_g = "android/build.gradle"
          if os.path.exists(root_g):
              with open(root_g, "a") as f:
                  f.write("\nsubprojects { afterEvaluate { p -> if (p.hasProperty(\"android\")) { p.android { compileSdkVersion 36 } } } }\n")
          '
          echo "=== local.properties ===" && cat android/local.properties

      - name: Récupérer les dépendances Flutter
        run: flutter pub get

      - name: Compiler le fichier APK Release
        run: flutter build apk --release --no-tree-shake-icons

      - name: Mettre à disposition l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Bibliotheque-PDF-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
